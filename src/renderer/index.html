<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; script-src 'self'"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: oklch(0.10 0.003 85); color-scheme: dark; }
      #spark-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: oklch(0.10 0.003 85);
        color: oklch(0.58 0.008 85);
        font: 500 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.14em; text-transform: uppercase;
        opacity: 0; pointer-events: none;
        animation: spark-boot-in 280ms cubic-bezier(0.22,1,0.36,1) 80ms forwards;
      }
      #spark-boot::before {
        content: ""; width: 6px; height: 6px; margin-right: 10px;
        background: #2AA298; border-radius: 1px;
        box-shadow: 0 0 10px rgba(42, 162, 152, 0.55);
        animation: spark-boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes spark-boot-in { to { opacity: 1; } }
      @keyframes spark-boot-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="spark-boot">Cora</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
