version: 2
updates:
  # One grouped pull request a month for minor and patch updates. Major
  # bumps (Electron, React, TypeScript, the Pi runtime) are taken by hand
  # because every merge to main is a release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "@earendil-works/*"
      - dependency-name: pi-web-search
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
