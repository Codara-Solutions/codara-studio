name: Release

# Releases are nightly, not per push: every run ships everything merged to
# main since the last vX.Y.Z tag as ONE release, built on GitHub's free macOS
# runners. One job builds, signs, and notarizes macOS and cross-builds the
# Windows installer, publishes both to the release bucket (running apps hear
# the SSE push within seconds), and pushes the vX.Y.Z tag that seeds the next
# version computation. A run with nothing new since the last tag, or whose
# HEAD is a "release: vX.Y.Z" bookkeeping commit (the local pipeline's bump),
# is skipped, so the two pipelines can coexist without ever double-releasing.
# Batching keeps the ~20 min build off the critical path of each merge and
# gives auto-updating users one download per day instead of one per PR.
# Branch protection requires the CI `test` check on an up-to-date branch, so
# the last PR merged before a run was tested on the exact tree that ships.
# Need something out now? `gh workflow run Release`.

on:
  schedule:
    # 03:00 UTC daily (05:00 Madrid in summer, 04:00 in winter).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # pushing the release tag

jobs:
  # Nothing ships untested: the release job only starts after every
  # typecheck and the full unit-test registry pass on the same OS the
  # build runs on. A red test means no build, no upload, no release.
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:node
      - run: npm run typecheck:web
      - run: npm run typecheck:e2e
      # Some suites drive the BUILT app surface (agent-socket handshake) or a
      # real Chromium (chat-surface-routing) — give them what they need.
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:all

  release:
    permissions:
      contents: write
      id-token: write
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for semantic versioning

      - name: Guard | signing secrets present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK (Developer ID .p12) secret is not set; refusing to publish unsigned macOS builds."
            exit 1
          fi
          if [ -z "$RELEASES_S3_ACCESS_KEY_ID" ]; then
            echo "::error::RELEASES_* bucket secrets are not set."
            exit 1
          fi

      - name: Version | semantic bump from conventional commits
        id: version
        run: node scripts/ci-version.cjs

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Build, sign, publish macOS
        if: steps.version.outputs.skip != 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
          RELEASES_S3_REGION: ${{ secrets.RELEASES_S3_REGION }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          RELEASES_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
        run: |
          npm run package:mac
          node scripts/publish-release.cjs mac

      - name: Build and publish Windows
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
          RELEASES_S3_REGION: ${{ secrets.RELEASES_S3_REGION }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          RELEASES_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
        run: |
          npm run package:win
          node scripts/publish-release.cjs win

      - name: Tag the release
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
