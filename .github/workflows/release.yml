name: Release

# A tag reserves a version only after both platforms have been built and saved.
# Publication can resume from that immutable bundle without rebuilding the version.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Original Release run ID to publish its saved artifacts (leave empty for a new release)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'Codara-Solutions/codara-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.version.outputs.skip || 'false' }}
      version: ${{ steps.version.outputs.version || steps.restored.outputs.version }}
      sha: ${{ steps.source.outputs.sha || github.sha }}
      run_id: ${{ inputs.resume_run_id || github.run_id }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard | new builds cannot replace a saved release
        if: inputs.resume_run_id == ''
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != 1 ]; then
            echo "::error::Re-run failed jobs, or dispatch with resume_run_id to reuse the original bundle. Start a new run if the build never finished."
            exit 1
          fi
      - name: Version | semantic bump from conventional commits
        id: version
        if: inputs.resume_run_id == ''
        run: node scripts/ci-version.cjs
      - name: Recovery | validate the source run and artifact
        id: source
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/release-github.cjs source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.resume_run_id != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: release-bundle
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Recovery | verify the saved bundle
        id: restored
        if: inputs.resume_run_id != ''
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/release-bundle.cjs verify

  test:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && inputs.resume_run_id == ''
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:all

  build:
    needs: [prepare, test]
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.saved.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Version | apply the reserved build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e 'const fs=require("node:fs");const p=require("./package.json");p.version=process.env.RELEASE_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Build and sign macOS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::macOS signing and notarization secrets are required."
            exit 1
          fi
          npm run package:mac
      - name: Build Windows
        run: npm run package:win
      - name: Seal both platforms for publication and recovery
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-bundle.cjs create
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: saved
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

  tag:
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip != 'true' &&
      (needs.build.result == 'success' || inputs.resume_run_id != '')
    environment: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id || needs.build.outputs.artifact_id }}
          path: release-bundle
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id }}
      - name: Verify saved artifacts before obtaining write credentials
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node scripts/release-bundle.cjs verify
      - name: Guard | dedicated release App configured
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY in the main-only release-tag environment."
            exit 1
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Create or verify the release tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node scripts/release-github.cjs tag

  publish:
    needs: [prepare, build, tag]
    if: always() && !cancelled() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id || needs.build.outputs.artifact_id }}
          path: release-bundle
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id }}
      - name: Verify tag and reject superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node scripts/release-github.cjs verify-tag
      - name: Publish immutable binaries, then promote both feeds
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
          RELEASES_S3_REGION: ${{ secrets.RELEASES_S3_REGION }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          RELEASES_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
        run: node scripts/publish-release-bundle.cjs
