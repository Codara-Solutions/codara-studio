name: macOS debug (temporary)

# Temporary, for fix/cora-macos-ci only: runs just the suites still failing on
# macOS so each fix gets an answer in minutes. Removed before the Cora PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: argv probe
        run: |
          cat > "$RUNNER_TEMP/probe.pl" <<'PERL'
          my $max = pack("i", 0); my $len = pack("Q", 4);
          my $r = syscall(202, pack("i2", 1, 8), 2, $max, $len, 0, 0);
          print "argmax r=$r err=$! max=", unpack("i", $max), " len=", unpack("Q", $len), "\n";
          my $size = unpack("i", $max);
          my $buf = "\0" x $size; $len = pack("Q", $size);
          $r = syscall(202, pack("i3", 1, 49, $ARGV[0]), 3, $buf, $len, 0, 0);
          print "procargs r=$r err=$! len=", unpack("Q", $len), "\n";
          my $n = unpack("Q", $len); my $show = substr($buf, 0, $n > 200 ? 200 : $n); $show =~ s/\0/|/g;
          print "head: $show\n";
          PERL
          sleep 30 & pid=$!
          perl -v | head -2
          perl "$RUNNER_TEMP/probe.pl" $pid; echo "exit=$?"
          kill $pid
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: |
          status=0
          for suite in test-servers test-mcp-tool-manifest test-browser-insight test-app-exit-electron; do
            echo "::group::$suite"
            node scripts/$suite.cjs || { status=1; echo "FAILED $suite"; }
            echo "::endgroup::"
          done
          exit $status
