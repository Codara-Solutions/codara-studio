name: macOS debug (temporary)

# Temporary, for fix/cora-macos-ci only: test-browser-cdp-access with the
# headless shell and with full Chromium. Removed before the Cora PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: |
          for i in 1 2 3; do echo "== shell run $i"; node scripts/test-browser-cdp-access.cjs 2>&1 | tail -3; done
          rm -rf ~/Library/Caches/ms-playwright/chromium_headless_shell-*
          for i in 1 2 3; do echo "== full chromium run $i"; node scripts/test-browser-cdp-access.cjs 2>&1 | tail -3; done
