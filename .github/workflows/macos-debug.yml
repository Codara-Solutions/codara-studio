name: macOS debug (temporary)

# Temporary, for fix/cora-macos-ci only: runs just the suites still failing on
# macOS so each fix gets an answer in minutes. Removed before the Cora PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: |
          status=0
          for suite in test-servers test-mcp-tool-manifest test-browser-insight test-app-exit-electron; do
            echo "::group::$suite"
            node scripts/$suite.cjs || { status=1; echo "FAILED $suite"; }
            echo "::endgroup::"
          done
          exit $status
