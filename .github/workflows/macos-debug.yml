name: macOS debug (temporary)

# Temporary, for fix/cora-macos-ci only. Removed before the Cora PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: |
          echo "== raw CDP, headless shell"; node scripts/diag-skip-pauses.cjs || true
          echo "== product test with diagnostics"; CODARA_DIAG_SKIP=1 node scripts/test-browser-cdp-access.cjs 2>&1 | tail -60 || true
