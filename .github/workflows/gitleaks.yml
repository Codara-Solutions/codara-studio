name: Gitleaks

# Scans the commits a pull request adds (and every push to the integration
# branches) for secrets, with the same .gitleaks.toml as the pre-commit hook.
# The hook only runs where gitleaks is installed and can be skipped; this is
# the check that cannot. Fixture conventions: CONTRIBUTING.md, "Secrets".

on:
  pull_request:
  push:
    branches: [main, Cora]

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Every suppression comes from the base branch, so a pull request
          # cannot allowlist its own finding: the config, the .gitleaksignore
          # (gitleaks also reads one from the checkout, so that copy is
          # removed), and no inline gitleaks:allow comments. A base without a
          # config falls back to the checkout's.
          config="$RUNNER_TEMP/gitleaks.toml"
          if ! git show "${BASE_SHA}:.gitleaks.toml" > "$config" 2>/dev/null; then
            cp .gitleaks.toml "$config"
          fi
          ignore_dir="$RUNNER_TEMP/gitleaks-ignore"
          mkdir -p "$ignore_dir"
          git show "${BASE_SHA}:.gitleaksignore" > "$ignore_dir/.gitleaksignore" 2>/dev/null || : > "$ignore_dir/.gitleaksignore"
          rm -f .gitleaksignore
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          echo "Scanning $range"
          # first-parent diffs for merge commits: a value typed while resolving
          # a merge conflict is in no parent's patch and would go unscanned.
          if ! "$RUNNER_TEMP/gitleaks" git --config "$config" --gitleaks-ignore-path "$ignore_dir" \
              --ignore-gitleaks-allow --redact --no-banner --verbose \
              --log-opts="--diff-merges=first-parent $range" .; then
            echo "::error title=Gitleaks::A secret-like value is in the commits above. If it is real, remove it from the history and rotate it. If it is a made-up test value, put it under tests/ or a scripts/test-*.cjs file, or mark it with FAKE_ (see CONTRIBUTING.md, Secrets)."
            exit 1
          fi
