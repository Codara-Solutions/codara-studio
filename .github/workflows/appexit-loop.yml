name: app-exit loop (temporary, issue 170)

# Temporary: runs test-app-exit-electron.cjs many times on macOS, with the
# app code from main ("before") and from this branch ("after"), idle and under
# CPU load. Removed before the pull request is marked ready.

on:
  push:
    branches: [fix/flaky-app-exit-electron]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: after, load: busy, shard: 1, runs: 30 }
          - { variant: after, load: busy, shard: 2, runs: 30 }
          - { variant: after, load: busy, shard: 3, runs: 30 }
          - { variant: before, load: busy, shard: 1, runs: 5 }
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: App code from main
        if: matrix.variant == 'before'
        run: git checkout origin/main -- src
      - run: npm run build
      - name: Loop
        env:
          LOAD: ${{ matrix.load }}
          RUNS: ${{ matrix.runs }}
        run: |
          if [ "$LOAD" = busy ]; then
            for n in 1 2; do (while :; do :; done) & done
          fi
          fails=0
          for i in $(seq 1 "$RUNS"); do
            start=$(date +%s)
            if node scripts/test-app-exit-electron.cjs > run.log 2>&1; then
              echo "run $i ok $(( $(date +%s) - start ))s"
            else
              fails=$((fails + 1))
              echo "run $i FAIL $(( $(date +%s) - start ))s"
              cat run.log
            fi
          done
          echo "TOTAL: $fails/$RUNS failed"
          jobs -p | xargs kill 2>/dev/null || true
          [ "$fails" -eq 0 ]
