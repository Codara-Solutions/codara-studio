name: app-exit loop (temporary, issue 170)

# Temporary: runs test-app-exit-electron.cjs many times on macOS, with the
# app code from main ("before") and from this branch ("after"), idle and under
# CPU load. Removed before the pull request is marked ready.

on:
  push:
    branches: [fix/flaky-app-exit-electron]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        variant: [after]
        load: [busy]
        shard: [1, 2]
        e2e: ['1', '0']
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: App code from main
        if: matrix.variant == 'before'
        run: git checkout origin/main -- src
      - run: npm run build
      - run: node scripts/appexit-trace-patch.cjs
      - name: Sweep
        env:
          LOAD: ${{ matrix.load }}
          SWEEP_E2E: ${{ matrix.e2e }}
        run: |
          if [ "$LOAD" = busy ]; then
            for n in 1 2; do (while :; do :; done) & done
          fi
          node scripts/appexit-sweep.cjs | tee sweep.log
          jobs -p | xargs kill 2>/dev/null || true
          grep -q "^STUCK 0/" sweep.log
