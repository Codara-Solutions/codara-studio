name: CI

# Pull-request gate: contributors' changes run the same typechecks and the
# full unit-test registry that gate releases, so a PR shows red before a
# human ever reviews broken code. Branch protection can require this check.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:node
      - run: npm run typecheck:web
      - run: npm run typecheck:e2e
      # Some suites drive the BUILT app surface (agent-socket handshake) or a
      # real Chromium (chat-surface-routing) — give them what they need.
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:all
