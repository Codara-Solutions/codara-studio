name: CI

# Pull-request gate: contributors' changes run the same typechecks and the
# full unit-test registry that gate releases, so a PR shows red before a
# human ever reviews broken code. Branch protection can require this check.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:node
      - run: npm run typecheck:web
      - run: npm run typecheck:e2e
      # Some suites drive the BUILT app surface (agent-socket handshake) or a
      # real Chromium (chat-surface-routing) — give them what they need.
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:all
