name: CI

# Run the release checks on pull requests and direct main pushes so a bypass
# cannot leave a regression undiscovered until the next nightly release.
#
# The unit suites took 22 minutes on one macOS runner: it has 3 cores, so the
# runner's default pool (cores - 2, sized for a shared desktop) ran one suite
# at a time, and the serial suites (test-cora-harness alone is over 4 minutes)
# cannot share a machine. They are split across four macOS runners: the pool
# in three shards next to the serial suites and the typechecks. Each shard runs
# one suite at a time: two at a time on 3 cores kept producing a new
# timing-sensitive failure every few runs (5 of 6 pool failures in the 30 runs
# of 17 Nov), and three saturated the cores and ran no faster. Each part has a
# time budget that fails it with the slowest suites named, long before the job
# timeout would cancel it. "test" is the required check and only reports the
# parts.
#
# A draft pull request runs nothing here: every job is skipped until it is
# marked ready (ready_for_review), which starts the full run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A newer push to a pull request replaces its run. Every other run (main,
  # dispatch) is its own group, so none is cancelled or dropped from a queue.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-pool:
    name: test (pool ${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      # Every shard finishes and reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Some suites drive the BUILT app surface (agent-socket handshake) or a
      # real Chromium (chat-surface-routing) — give them what they need.
      - run: npm run build
      - run: npx playwright install chromium
      # No timings cache: one suite at a time runs in name order, and the
      # runner reads past durations only to order a pool of several.
      - name: Unit suites, all but the serial ones, this shard
        env:
          CODARA_TEST_PART: pool
          # A third of the pool: the slow suites listed in run-all-tests.cjs
          # (SLOW_POOL_SUITES) balanced by their seconds, the rest by name.
          CODARA_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # One suite at a time: nothing timing-sensitive shares the 3 cores.
          CODARA_TEST_JOBS: "1"
          # About 430 s of suite time per shard one at a time (run
          # 44202611290: 1302 s for the whole pool). 900 s is about twice
          # that, so a slow suite is named well before the job's 30 min.
          CODARA_TEST_BUDGET_SECONDS: "900"
        run: npm run test:all

  test-serial:
    name: test (serial, typecheck)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:node
      - run: npm run typecheck:web
      - run: npm run typecheck:e2e
      - run: npm run typecheck:pi-cora
      # test-app-exit-electron boots the built app. No serial suite needs
      # Playwright's Chromium.
      - run: npm run build
      - name: Serial unit suites
        env:
          CODARA_TEST_PART: serial
          CODARA_TEST_BUDGET_SECONDS: "720"
        run: npm run test:all

  test:
    # A skipped required check counts as passed, so on a draft this job is
    # skipped under another name: the pull request has no "test" check until
    # it is marked ready, and a missing required check blocks the merge.
    name: ${{ github.event.pull_request.draft && 'test (skipped, draft)' || 'test' }}
    needs: [test-pool, test-serial]
    # Otherwise this job must run and fail whenever any part did not succeed:
    # failures, timeouts and cancellations included.
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          POOL: ${{ needs.test-pool.result }}
          SERIAL: ${{ needs.test-serial.result }}
        run: |
          echo "test (pool 1/3, 2/3, 3/3): $POOL"
          echo "test (serial, typecheck): $SERIAL"
          [ "$POOL" = success ] && [ "$SERIAL" = success ]
