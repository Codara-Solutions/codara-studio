name: PR hygiene

# Size budget and wrong-base check for every pull request
# (scripts/check-pr-hygiene.cjs). It re-runs when labels change, so adding
# the large-pr label clears a size failure without a new push.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Size and base
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # A fork's branch named like an integration branch is still a
          # feature branch here.
          PR_HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || format('fork/{0}', github.head_ref) }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-hygiene.cjs
