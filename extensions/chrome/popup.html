<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Codara</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="hd">
      <img src="icons/icon-32.png" alt="" width="18" height="18" />
      <strong>Codara</strong>
      <span id="status" class="cs" data-state="idle" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Not connected</span></span>
    </header>

    <section id="connect" class="sec" hidden>
      <p id="connect-text">Connect this browser to Codara so agents can use the tabs you share.</p>
      <p id="pairing" class="pairing" hidden>
        Allow this code in Codara:
        <span id="pairing-code" class="code"></span>
      </p>
      <p id="connect-error" class="error" role="alert" hidden></p>
      <button id="connect-button" type="button" class="btn pri wide">Connect to Codara</button>
    </section>

    <section id="this-tab" class="sec" hidden>
      <div class="row">
        <span id="tab-fav" class="fav" aria-hidden="true"></span>
        <div class="grow">
          <div id="tab-title" class="ttl"></div>
          <div id="tab-host" class="host"></div>
        </div>
        <input id="share-tab" class="sw" type="checkbox" role="switch" aria-label="Let agents use this tab" />
      </div>
      <p id="tab-note" class="note" hidden></p>
      <div id="tab-agent" class="row" hidden>
        <span class="agentchip"><i id="tab-agent-dot"></i><span id="tab-agent-name"></span></span>
        <span id="tab-usage" class="dim grow"></span>
      </div>
      <details id="tab-details" class="details">
        <summary>Details</summary>
        <div class="row">
          <code id="tab-id"></code>
          <button id="copy-id" type="button" class="btn">Copy tab id</button>
        </div>
      </details>
    </section>

    <section id="reach" class="sec" hidden>
      <div id="reach-label" class="lbl">Agents may use</div>
      <div id="reach-choice" class="seg" role="radiogroup" aria-labelledby="reach-label" aria-describedby="reach-note">
        <button type="button" role="radio" data-reach="tabs">Tabs I pick</button>
        <button type="button" role="radio" data-reach="window">This window</button>
        <button type="button" role="radio" data-reach="all">Everything</button>
      </div>
      <p id="reach-note" class="note"></p>
      <label class="row">
        <span class="grow">Open new tabs in a group</span>
        <input id="allow-open" class="sw" type="checkbox" role="switch" />
      </label>
      <label id="storage-row" class="row">
        <span class="grow">Read and change cookies and storage here</span>
        <input id="share-storage" class="sw" type="checkbox" role="switch" aria-describedby="storage-note" />
      </label>
      <p id="storage-note" class="note">Even when off, agents see site storage, non-HttpOnly cookies and requests, sign-in headers included.</p>
    </section>

    <section id="ask" class="sec ask" hidden>
      <p id="ask-text"></p>
      <div class="row end">
        <button id="ask-no" type="button" class="btn">Cancel</button>
        <button id="ask-yes" type="button" class="btn pri">Allow</button>
      </div>
    </section>

    <section id="shared" class="sec" hidden>
      <div class="row">
        <div id="shared-label" class="lbl grow">Shared tabs</div>
        <button id="stop-all" type="button" class="btn stop">Stop all</button>
      </div>
      <ul id="shared-list" aria-labelledby="shared-label"></ul>
    </section>

    <footer class="pfoot">
      <button id="open-options" type="button" class="link">Blocked sites</button>
      <button id="unpair" type="button" class="link" hidden>Disconnect</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
