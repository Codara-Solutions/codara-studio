\* expect: pass
\* With the proposed fixes, two rows: a row left behind never shares its
\* folder with a new one, and no removal deletes another row's folder.
SPECIFICATION Spec
CONSTANTS
    Rows = {"r1", "r2"}
    Branches = {"b"}
    MaxCommits = 3
    MaxCrashes = 1
    Act = {"agentrm", "uses", "self", "reuse", "partial"}
    Bug = {}
    Fix = {"aside", "rescan", "paths", "bind", "refsave", "keepref"}
INVARIANTS
    NoIgnoredLost
    NeverRemovedInUse
    NoUnsafeRemoved
    RemovedReachable
    NoCollateral
    OneCheckoutPerBranch
    OneRowPerPath
CHECK_DEADLOCK FALSE
