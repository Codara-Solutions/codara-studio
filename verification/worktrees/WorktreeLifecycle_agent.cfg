\* expect: pass
\* Today's codara_worktree_remove beside the automatic removal, one worktree:
\* the owner or another agent asks, with terminals, tabs (its own workspace's
\* and other workspaces' on its files), ignored files, crashes,
\* merges, deleted and force-pushed remote branches, a branch checked out again,
\* a removal that fails halfway, a row whose folder is already gone.
SPECIFICATION Spec
CONSTANTS
    Rows = {"r1"}
    Branches = {"b"}
    MaxCommits = 3
    MaxCrashes = 1
    Act = {"agentrm", "uses", "proc", "tabs", "ftab", "ignored", "late", "self", "force", "reuse", "partial"}
    Bug = {}
    Fix = {}
INVARIANTS
    NoIgnoredLost
    NeverRemovedInUse
    NoUnsafeRemoved
    RemovedReachable
    NoCollateral
    OneCheckoutPerBranch
    OneRowPerPath
CHECK_DEADLOCK FALSE
