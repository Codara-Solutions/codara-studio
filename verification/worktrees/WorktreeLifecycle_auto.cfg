\* expect: pass
\* Today's automatic removal, one worktree, with everything it is built to
\* handle: terminals, processes, its own tabs, ignored files, crashes,
\* squash and merge commits, deleted and force-pushed remote branches, an
\* agent removing the folder itself, a branch checked out again, a removal
\* that fails halfway.
SPECIFICATION Spec
CONSTANTS
    Rows = {"r1"}
    Branches = {"b"}
    MaxCommits = 3
    MaxCrashes = 1
    Act = {"uses", "proc", "tabs", "ignored", "self", "force", "reuse", "partial"}
    Bug = {}
    Fix = {}
INVARIANTS
    NoIgnoredLost
    NeverRemovedInUse
    NoUnsafeRemoved
    RemovedReachable
    NoCollateral
    OneCheckoutPerBranch
    OneRowPerPath
CHECK_DEADLOCK FALSE
