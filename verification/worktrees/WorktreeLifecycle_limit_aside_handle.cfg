\* expect: NoIgnoredLost
\* LIMIT of the move aside: a file handle opened before the move still writes,
\* so an ignored file written between the last check and the delete is lost.
SPECIFICATION Spec
CONSTANTS
    Rows = {"r1"}
    Branches = {"b"}
    MaxCommits = 3
    MaxCrashes = 0
    Act = {"ignored", "handle"}
    Bug = {}
    Fix = {}
INVARIANTS
    NoIgnoredLost
CHECK_DEADLOCK FALSE
